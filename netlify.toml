# Netlify deployment configuration.
#
# Contains NO credentials, and requires NONE. RaktSetu is self-contained: the
# data layer runs entirely in the visitor's own browser, so there is no
# database URL, no API key and no environment variable to set. A fresh clone
# deploys and runs as-is.
#
# (The Supabase packages were removed from package.json; nothing in src/ imports
# them any more.)

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # The server data layer is Node's built-in `node:sqlite`
  # (src/lib/server/db.ts), resolved with a bare require and NO
  # --experimental-sqlite flag — nothing in a serverless request path can set
  # one. That builtin exists from Node 22.5.0 but is only available UNFLAGGED
  # from 22.13.0, so this pin must never drop below 22: on an older runtime
  # every authenticated page throws on first database access, while `next dev`
  # on a modern local Node keeps working and hides it until deploy.
  # scripts/check-invariants.ts asserts the floor; keep the two in step.
  NODE_VERSION = "22"

# Next.js on Netlify needs this so client-side navigation requests are rewritten
# to the SSR server instead of 404ing, and middleware runs at the edge.
[[plugins]]
  package = "@netlify/plugin-nextjs"

