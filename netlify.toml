# Netlify deployment configuration.
#
# Contains NO credentials, and requires NONE. RaktSetu needs no database URL, no
# API key and no environment variable to set.
#
# (The Supabase packages were removed from package.json; nothing in src/ imports
# them any more.)
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE DEPLOYING: STORAGE
# ---------------------------------------------------------------------------
#
# The data layer is SERVER-SIDE SQLite — a single file written to
# `./data/raktsetu.db` beside the app (src/lib/server/db.ts). That is correct
# for a host with a persistent, writable filesystem, which is what `next dev`
# and `next start` give you locally.
#
# Netlify FUNCTIONS DO NOT. A function bundle runs with a READ-ONLY working
# directory and an ephemeral /tmp, so the file can be neither created nor
# persisted. A read-only deployment now fails loudly and specifically ("the
# account database is not writable in the current deployment") with an error ID
# in the server log, rather than silently appearing to work.
#
# It deliberately does NOT fall back to /tmp: writes there would "succeed" and
# every account would silently vanish on the next cold start. An honest failure
# is strictly better than a fake success that loses people's data.
#
# To run on Netlify, deploy to a target that provides a PERSISTENT WRITABLE
# volume for the function (a container/VM with a mounted disk) rather than the
# standard ephemeral function runtime. No code change is needed for that.
#
# WHAT THIS FILE MUST NOT DO
#
# Do not "fix" a storage failure by pointing the database at a temporary
# directory, and do not add a filesystem-affinity flag to serialise functions:
# neither makes the data durable, and both hide the real constraint.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # The server data layer is Node's built-in `node:sqlite`
  # (src/lib/server/db.ts), resolved with a bare require and NO
  # --experimental-sqlite flag — nothing in a serverless request path can set
  # one. That builtin exists from Node 22.5.0 but is only available UNFLAGGED
  # from 22.13.0, so this pin must never drop below 22: on an older runtime
  # every authenticated page throws on first database access, while `next dev`
  # on a modern local Node keeps working and hides it until deploy.
  # scripts/check-invariants.ts asserts the floor; keep the two in step.
  NODE_VERSION = "22"

# Next.js on Netlify needs this so client-side navigation requests are rewritten
# to the SSR server instead of 404ing, and middleware runs at the edge.
[[plugins]]
  package = "@netlify/plugin-nextjs"

